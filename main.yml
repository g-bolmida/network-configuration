---
- name: Router Configuration
  hosts: georges-router
  gather_facts: false
  connection: ansible.netcommon.network_cli

  tasks:
    - name: General
      ansible.builtin.import_tasks: tasks/general.yml
      tags: [general]

    - name: Interfaces
      ansible.builtin.import_tasks: tasks/interfaces.yml
      tags: [interfaces]

    - name: Monitoring
      ansible.builtin.import_tasks: tasks/monitoring.yml
      tags: [monitoring]
