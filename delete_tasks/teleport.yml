---

- name: Ensure persistent Teleport directory exists
  ansible.builtin.file:
    path: "{{ teleport_dir }}/{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - bin
    - data
    - scripts
  become: true

- name: Check if teleport binary already installed at this version
  ansible.builtin.stat:
    path: "{{ teleport_dir }}/bin/teleport-v{{ teleport_version }}"
  register: teleport_bin_check
  become: true

- name: Download and extract Teleport tarball
  ansible.builtin.unarchive:
    src: "{{ teleport_tarball_url }}"
    dest: "/tmp"
    remote_src: true
  when: not teleport_bin_check.stat.exists

