all:
  children:
    vyos_hosts:
      vars:
        ansible_host: 192.168.1.30
        ansible_user: vyos
        ansible_ssh_pass: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          33303038396138653564313335363162643665323264393639633236303432623830643031363363
          6231346566303438396433383163313530326437626365660a633636376164653233653835656237
          33326131336436663862323766613266323930313466313535323235623335383164663435306530
          6437616238326666310a306630313632393139323938353632666435303430623833616565343734
          3463
        ansible_network_os: vyos
        ansible_port: 2222
      children:
        vyos_direct_ssh:
          hosts:
            georges-router-ssh:
              ansible_connection: ssh
        vyos_direct_netcli:
          hosts:
            georges-router:
              ansible_connection: ansible.netcommon.network_cli
        vyos_teleport_ssh:
          hosts:
            georges-router-teleport-ssh:
              ansible_connection: ssh
              ansible_network_cli_ssh_type: libssh
              # idk if this will actually, work will verify later
              ansible_ssh_common_args: '-o ProxyCommand="tsh proxy ssh --user=vyos --cluster=bolmida.cloud -J %h %p"'
        vyos_teleport_netcli:
          hosts:
            georges-router-teleport-netcli:
              ansible_connection: ansible.netcommon.network_cli
              ansible_network_cli_ssh_type: libssh
              # idk if this will actually, work will verify later
              ansible_libssh_proxy_command: "tsh proxy ssh --user=vyos --cluster=bolmida.cloud %r@%h"
